name: CI

# Run on every branch push so work in progress is checked before it reaches a
# pull request, and on pull requests so forks are covered too.
on:
  push:
  pull_request:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt / clippy / test
    # Pinned rather than ubuntu-latest so a runner-image bump can't change the
    # available system libraries underneath the build without a commit here.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Two separate needs, both required:
      #   * -sys build scripts probe pkg-config and fail outright without the
      #     headers: alsa, opus, freetype.
      #   * the final link line wants -lfreetype -lxcb -lxkbcommon
      #     -lxkbcommon-x11. Those last three come from `#[link]` attributes in
      #     crate source rather than from build-script output, so they are easy
      #     to miss by inspecting build scripts alone.
      # Wayland and fontconfig really are dlopen'd, so they stay runtime-only.
      # zstd and ring build vendored copies.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libfreetype-dev \
            libopus-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      # GitHub's runner image ships rustup, but `act` containers and bare
      # self-hosted runners do not, so install it when it is missing instead of
      # assuming it. Edition 2024 needs Rust 1.85 or newer.
      - name: Set up Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            # $GITHUB_PATH covers later steps; PATH covers the rest of this one.
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup component add rustfmt clippy
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Cheapest gate first: no compilation, so formatting fails fast.
      - name: cargo fmt --check
        run: cargo fmt --check

      # Cargo.toml sets `[lints.rust] warnings = "deny"` and
      # `[lints.clippy] pedantic = "deny"`, so this needs no extra flags.
      # Deliberately no RUSTFLAGS=-D warnings: it would apply to dependencies
      # too, and could override the curated crate-level allows in src/lib.rs.
      - name: cargo clippy --all-targets
        run: cargo clippy --locked --all-targets

      # The tests are pure functions over pixel/geometry maths and never open a
      # window, so they run headless with no virtual display.
      - name: cargo test --all-targets
        run: cargo test --locked --all-targets

      # The terminal frontend exists so parallhex can run on hosts that lack
      # gpui's link-time libraries (freetype, xcb, xkbcommon). That only holds if
      # gpui stays out of a TUI-only build, so assert it rather than trust it.
      - name: the TUI must not depend on gpui
        run: |
          if cargo tree --locked --no-default-features --features tui-frontend \
               | grep -q gpui; then
            echo "gpui leaked into the TUI-only dependency tree" >&2
            cargo tree --locked --no-default-features --features tui-frontend | grep gpui >&2
            exit 1
          fi

      # Compile and test that configuration too: the leak check proves gpui is
      # absent from the tree, this proves the code still builds without it.
      - name: cargo test (TUI only)
        run: cargo test --locked --no-default-features --features tui-frontend --all-targets

      # And the core on its own, with no frontend at all.
      - name: cargo test (core only)
        run: cargo test --locked --no-default-features
