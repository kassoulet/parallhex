[package]
name = "parallhex"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The executable is named for its toolkit so a gpui build can sit alongside
# another parallhex binary without clashing. Only the *binary* is renamed: the
# package, the `actions!` namespace and the config directory stay `parallhex`, so
# an existing preferences file is still found.
[lib]
name = "parallhex"
path = "src/lib.rs"

[[bin]]
name = "parallhex-gpui"
path = "src/bin/parallhex-gpui.rs"
required-features = ["gpui-frontend"]

[[bin]]
name = "parallhex-tui"
path = "src/bin/parallhex-tui.rs"
required-features = ["tui-frontend"]

[dependencies]
memmap2 = "0.9"
rayon = "1.10"

# The gpui frontend's dependencies are optional so that a frontend which does not
# need them -- a terminal one -- can be built on a host without gpui's link-time
# libraries (freetype, xcb, xkbcommon). `image` is only used to wrap a buffer as
# a gpui texture, and `rfd` only for the file dialog, so both are gpui-only.
gpui = { version = "0.2.2", optional = true }
image = { version = "0.25", optional = true }
rfd = { version = "0.14", optional = true }

# ratatui re-exports crossterm (`ratatui::crossterm`), so the terminal frontend
# needs no separate crossterm dependency and the two versions cannot drift.
ratatui = { version = "0.27", optional = true }

[features]
default = ["gpui-frontend", "tui-frontend"]
gpui-frontend = ["gpui", "image", "rfd"]
tui-frontend = ["ratatui"]

# Warnings-as-errors for both the compiler and clippy's pedantic group.
#
# A small set of pedantic lints is deliberately allowed crate-wide (see the
# `#![allow(...)]` at the top of `src/main.rs`): packed RGB/RGBA color
# literals, the f32/f64/usize casts used in pixel/scroll math, and float
# equality against exactly-representable constants. They are enabled there
# rather than here because Cargo's emission order of `--allow` / `--deny`
# flags is not under our control, and the last flag wins for each lint, so
# crate attributes are the reliable place for the curated overrides.
[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "deny"
